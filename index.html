<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BBF 성경통독</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8f5;
      color: #222;
    }

    .wrap {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px 18px 60px;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 30px;
    }

    .sub {
      color: #6f746f;
      margin-bottom: 28px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    }

    .group-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .person {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .person:last-child {
      border-bottom: none;
    }

    .rate {
      font-weight: 700;
      color: #4f7d61;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #4f7d61;
      color: white;
      font-size: 17px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>BBF 성경통독</h1>
    <div class="sub">Blessing Bible Friends</div>

    <div class="card">
      <div class="group-title">16조</div>

      <div class="person">
        <span>김리화</span>
        <span class="rate">98%</span>
      </div>

      <div class="person">
        <span>조원 2</span>
        <span class="rate">95%</span>
      </div>

      <div class="person">
        <span>조원 3</span>
        <span class="rate">91%</span>
      </div>

      <button>통독 기록 보기</button>
    </div>
  </div>
</body>
</html>
